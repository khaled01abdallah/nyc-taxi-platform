[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3", "tenacity", "pyyaml", "databricks-sdk"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "moto[s3]"]

[tool.setuptools.packages.find]
include = ["ingestion*", "transformations*"]

[tool.ruff]
line-length = 100